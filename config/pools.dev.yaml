        type: native
        gasReserve: '100000000000000'  # 0.0001 cBTC reserved for gas
      - wrappedToken: '0x1b70ae756b1089cc5948e4f8a2ad498df30e897d'  # svJUSD
        type: erc4626
        underlyingToken: '0x0987d3720d38847ac6dbb9d025b9de892a3ca35c'  # JUSD
    portfolio:
      initialToken0: 100       # 100 JUSD
      initialToken1: 0.0015    # 0.0015 cBTC
    monitoring:
      checkIntervalSeconds: 30
