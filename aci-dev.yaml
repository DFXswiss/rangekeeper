apiVersion: 2023-05-01
location: westeurope
name: ci-dfx-rk-dev
type: Microsoft.ContainerInstance/containerGroups
properties:
  osType: Linux
  containers:
    - name: rk
      properties:
        image: dfxswiss/rangekeeper:beta
        resources:
          requests:
            cpu: 0.5
            memoryInGb: 1.0
        ports:
          - port: 3000
        environmentVariables:
          # Secrets (from GitHub Secrets)
          - name: PRIVATE_KEY
            secureValue: '${PRIVATE_KEY}'
          - name: ETHEREUM_RPC_URL
            secureValue: '${ETHEREUM_RPC_URL}'
          - name: POLYGON_RPC_URL
            secureValue: '${POLYGON_RPC_URL}'
          - name: TELEGRAM_BOT_TOKEN
            secureValue: '${TELEGRAM_BOT_TOKEN}'
          - name: TELEGRAM_CHAT_ID
            secureValue: '${TELEGRAM_CHAT_ID}'
          - name: DISCORD_WEBHOOK_URL
            secureValue: '${DISCORD_WEBHOOK_URL}'
          # Config (changeable)
          - name: DEPLOY_INFO
            value: '${DEPLOY_INFO}'
          - name: LOG_LEVEL
            value: 'info'
          - name: HEALTH_PORT
            value: '3000'
          - name: MAX_TOTAL_LOSS_PERCENT
            value: '10'
          - name: DRY_RUN
            value: 'false'
        volumeMounts:
          - name: volume
            mountPath: /app/data
  volumes:
    - name: volume
      azureFile:
        shareName: ci-rk
        storageAccountName: stdfxapidev
        storageAccountKey: '${STORAGE_KEY}'
  restartPolicy: Always
  imageRegistryCredentials:
    - server: index.docker.io
      username: '${DOCKER_USERNAME}'
      password: '${DOCKER_PASSWORD}'
  diagnostics:
    logAnalytics:
      workspaceId: '${LOG_WORKSPACE_ID}'
      workspaceKey: '${LOG_WORKSPACE_KEY}'
